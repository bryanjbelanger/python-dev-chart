type: application
version: 1.0.0
appVersion: "3.12"

keywords:
  - python
  - development
  - devcontainer
  - vscode
  - talos
  - argocd

home: https://github.com/bryanjbelanger/python-dev-environment.git

sources:
  - https://github.com/bryanjbelanger/python-dev-environment.git

maintainers:
  - name: Bryan Belanger
    email: bryanbelanger@hotmail.com
    url: https://github.com/bryanjbelanger

annotations:
